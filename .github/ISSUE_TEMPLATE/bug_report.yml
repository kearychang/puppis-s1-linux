name: Bug report
description: Report reproducible incorrect behavior without private device or network data.
title: "[Bug]: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, SSIDs, MAC addresses, serial numbers, raw captures, or unreviewed diagnostics. Use private vulnerability reporting for security issues.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observable behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux environment
      placeholder: Ubuntu 26.04 amd64, desktop environment, Wayland or X11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and identifying device/network data.
          required: true
